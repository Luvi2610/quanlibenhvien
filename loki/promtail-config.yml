server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://clinic_loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: 'docker'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(clinic_.*)'
        target_label: 'container_name'
      - source_labels: ['__meta_docker_container_name']
        regex: '/clinic_nginx'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/clinic_app'
        action: keep
    pipeline_stages:
      - match:
          selector: '{container_name="clinic_nginx"}'
          stages:
            - regex:
                expression: '^(?P<remote_addr>[\w\.]+) - - \[(?P<time>[^\]]+)\] "(?P<method>\w+) (?P<path>[^\s]+)[^"]*" (?P<status>\d+)'
            - labels:
                method:
                status:
      - match:
          selector: '{container_name="clinic_app"}'
          stages:
            - json:
                expressions:
                  level: level
                  method: method
                  status: status
                  event: event
            - labels:
                level:
                method:
                status:
                event: