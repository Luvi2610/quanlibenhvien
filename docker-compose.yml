version: '3.8'

services:
  app:
    build: ./app
    container_name: clinic_app
    restart: always
    environment:
      - PORT=3000
    networks:
      - clinic-net

  db:
    image: postgres:15-alpine
    container_name: clinic_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: StrongPassword123!
      POSTGRES_DB: clinic_management
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - clinic-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: clinic_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: AdminPassword123!
    ports:
      - "5050:80"
    networks:
      - clinic-net

  nginx:
    build: ./nginx
    container_name: clinic_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - clinic-net

  # Thêm cAdvisor để thu thập thông số CPU/RAM của container
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: clinic_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - clinic-net

  prometheus:
    image: prom/prometheus:latest
    container_name: clinic_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - clinic-net

  grafana:
    image: grafana/grafana:latest
    container_name: clinic_grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - clinic-net

  loki:
    image: grafana/loki:latest
    container_name: clinic_loki
    restart: always
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki.yaml
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yaml
    networks:
      - clinic-net

  promtail:
    image: grafana/promtail:latest
    container_name: clinic_promtail
    restart: always
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/promtail.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail.yaml
    networks:
      - clinic-net

volumes:
  pgdata:

networks:
  clinic-net:
    driver: bridge