version: '3.8'

services:
  app:
    build: ./app
    container_name: clinic_app
    restart: always
    environment:
      - PORT=3000
    networks:
      - clinic-net

  db:
    image: postgres:15-alpine
    container_name: clinic_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: StrongPassword123!
      POSTGRES_DB: clinic_management
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - clinic-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: clinic_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: AdminPassword123!
    ports:
      - "5050:80"
    networks:
      - clinic-net

  nginx:
    build: ./nginx
    container_name: clinic_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - clinic-net

volumes:
  pgdata:

networks:
  clinic-net:
    driver: bridge