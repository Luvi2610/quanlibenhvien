global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'clinic-app'
    static_configs:
      - targets: ['app:3000']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['clinic_cadvisor:8080']
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']